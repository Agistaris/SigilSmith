name: Documentation checks

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'README.md'
      - 'docs/WORKFLOW.md'
      - 'docs/INSTALL.md'
      - 'docs/RELEASE.md'
      - 'scripts/test_workflow_docs.py'
      - '.github/workflows/docs.yml'
  push:
    paths:
      - '.gitignore'
      - 'README.md'
      - 'docs/WORKFLOW.md'
      - 'docs/INSTALL.md'
      - 'docs/RELEASE.md'
      - 'scripts/test_workflow_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check documentation routes and workflow contract
        run: python3 -B scripts/test_workflow_docs.py
