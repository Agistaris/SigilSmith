name: release

# Manual only: releases are built and published locally (docs/RELEASE.md),
# so a tag push should not build or publish a second set of packages.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y rpm libfuse2

      - name: Install cargo packaging tools
        run: cargo install cargo-deb cargo-rpm

      - name: Build packages
        run: ./packaging/build-packages.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sigilsmith-packages
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
